<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseller Inventory &amp; Profit Tracker</title>
<style>
:root{
  --bg:#F4F6F7; --card:#FFFFFF; --ink:#1B2A36; --ink2:#31485A; --grey:#5A6B78;
  --rule:#E2E6E9; --soft:#F7F8F9; --acc:#0F7B6C; --accL:#E6F2F0;
  --ok:#12B76A; --warn:#B9770E; --bad:#C0392B; --navy:#2E5C8A;
}
[data-dark="1"]{
  --bg:#121A1E; --card:#182226; --ink:#EDEFEF; --ink2:#C7D0D3; --grey:#8FA0A7;
  --rule:#28343A; --soft:#1B262B; --accL:#173832;
}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);}
.app{max-width:1200px;margin:0 auto;}
header.top{background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:10;}
.toprow{display:flex;align-items:center;gap:20px;padding:14px 22px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:19px;}
.brand .box{width:22px;height:22px;border:3px solid var(--acc);border-radius:6px;}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;}
nav.tabs button{background:none;border:none;padding:9px 14px;border-radius:8px;font-size:15px;font-weight:bold;color:var(--grey);cursor:pointer;}
nav.tabs button.active{background:var(--accL);color:var(--acc);}
.spacer{flex:1;}
.iconbtn{background:none;border:1px solid var(--rule);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink2);font-size:13px;font-weight:bold;}
main{padding:22px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr;}.grid3{grid-template-columns:1fr 1fr;}.grid2{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px;}
.kpi .label{font-size:12px;font-weight:bold;color:var(--grey);letter-spacing:.03em;text-transform:uppercase;}
.kpi .val{font-size:30px;font-weight:bold;margin:6px 0 2px;}
.kpi .sub{font-size:12px;color:var(--grey);}
h2{font-size:19px;margin:0 0 4px;}
p.hint{font-size:13px;color:var(--grey);margin:0 0 14px;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--grey);padding:8px 10px;border-bottom:1px solid var(--rule);}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold;}
.pill.ok{background:var(--accL);color:var(--acc);}
.pill.low{background:#FCE8CB;color:var(--warn);}
.pill.out{background:#F5D9D6;color:var(--bad);}
.pill.archived{background:var(--soft);color:var(--grey);}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:bold;font-size:14px;cursor:pointer;}
.btn.ghost{background:none;border:1px solid var(--rule);color:var(--ink2);}
.btn.small{padding:6px 10px;font-size:12px;border-radius:6px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--soft);color:var(--ink);width:100%;}
label{font-size:12px;font-weight:bold;color:var(--grey);display:block;margin-bottom:4px;}
.field{margin-bottom:12px;}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,18,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;}
.modal-bg.open{display:flex;}
.modal{background:var(--card);border-radius:12px;padding:24px;max-width:560px;width:100%;}
.modal h3{margin-top:0;}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);}
.list-item:last-child{border-bottom:none;}
.empty{color:var(--grey);font-size:13px;padding:20px 0;text-align:center;}
footer.note{font-size:12px;color:var(--grey);text-align:center;padding:20px;}
.chipbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:bold;border:1px solid var(--rule);background:var(--soft);color:var(--ink2);cursor:pointer;}
.chip.active{background:var(--acc);color:#fff;border-color:var(--acc);}
.barrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.barrow .lbl{width:90px;font-size:12px;color:var(--grey);flex-shrink:0;}
.barrow .track{flex:1;height:16px;background:var(--soft);border-radius:5px;overflow:hidden;}
.barrow .fill{height:100%;background:var(--navy);}
.barrow .amt{width:86px;text-align:right;font-size:12px;font-weight:bold;flex-shrink:0;}
.pnlrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px;}
.pnlrow.total{font-weight:bold;border-top:2px solid var(--ink);border-bottom:none;padding-top:12px;margin-top:4px;}
.pnlrow .neg{color:var(--bad);}
.note-box{background:var(--soft);border:1px dashed var(--rule);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--grey);margin-top:10px;}
.demo-banner{position:sticky;top:0;z-index:9999;background:#B9770E;color:#fff;font:600 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:9px 14px}
.demo-banner a{color:#fff;text-decoration:underline}
.demo-banner .x{position:absolute;right:10px;top:6px;background:none;border:none;color:#fff;font:inherit;cursor:pointer;opacity:.85;padding:4px 8px}
.demo-banner .x:hover{opacity:1}
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner">DEMO — example data, add up to 15 of your own inventory items and see whether it thinks the way you do. Nothing is saved permanently and it can reset any time. <a href="https://www.etsy.com/shop/LedgerLoopStudio" target="_blank" rel="noopener">Buy the full version</a> for your own unlimited, permanent copy.<button class="x" onclick="document.getElementById('demoBanner').style.display='none'" aria-label="Dismiss">✕</button></div>
<div class="app" id="app"></div>

<script id="engine">
/* ===================== PURE FUNCTIONS (unit-testable) ===================== */
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function toISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function parseISO(s){
  if(!s) return null;
  var p = String(s).split("-");
  if(p.length!==3) return null;
  var y=parseInt(p[0],10), m=parseInt(p[1],10), d=parseInt(p[2],10);
  if(!y||!m||!d) return null;
  return new Date(y, m-1, d);
}
function todayISO(){ return toISO(new Date()); }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function monthKey(iso){ return iso ? iso.slice(0,7) : ""; }
function yearOf(iso){ return iso ? iso.slice(0,4) : ""; }
function uid(){ return "r" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function formatMoney(amount, symbol){
  symbol = symbol || "$";
  var n = round2(amount);
  var neg = n < 0;
  var s = symbol + Math.abs(n).toFixed(2);
  return neg ? "-" + s : s;
}
function daysBetween(aISO, bISO){
  var a = parseISO(aISO), b = parseISO(bISO);
  if(!a || !b) return null;
  return Math.round((b-a)/86400000);
}

/* ---- mileage engine, reused verbatim from Mileage & Tax Deduction Tracker ----
   Same multi-jurisdiction tiered-bracket math: this is the differentiator the category's
   own $18.99 bestseller (OzkMtnGoods) is missing, per its own buyer review. Kept identical
   so both products stay in sync and both pass the same test suite. */
var RATE_PRESETS = {
  US_IRS:  { code:"US_IRS",  label:"USA — IRS standard mileage rate", unit:"mi",
             tiers:[{upTo:Infinity, rate:0.70}] },
  CA_CRA:  { code:"CA_CRA",  label:"Canada — CRA automobile allowance", unit:"km",
             tiers:[{upTo:5000, rate:0.72},{upTo:Infinity, rate:0.66}] },
  UK_HMRC: { code:"UK_HMRC", label:"UK — HMRC approved mileage rate (car/van)", unit:"mi",
             tiers:[{upTo:10000, rate:0.45},{upTo:Infinity, rate:0.25}] },
  AU_ATO:  { code:"AU_ATO",  label:"Australia — ATO cents-per-km method", unit:"km",
             tiers:[{upTo:Infinity, rate:0.88}] },
  CUSTOM:  { code:"CUSTOM",  label:"Custom rate", unit:"mi",
             tiers:[{upTo:Infinity, rate:0.67}] }
};
function tieredAmount(distance, tiers){
  distance = Math.max(0, Number(distance)||0);
  var remaining = distance, total = 0, prevLimit = 0;
  for(var i=0;i<tiers.length;i++){
    var tier = tiers[i];
    var bandSize = tier.upTo === Infinity ? Infinity : (tier.upTo - prevLimit);
    var used = Math.min(remaining, bandSize);
    total += used * tier.rate;
    remaining -= used;
    prevLimit = tier.upTo;
    if(remaining <= 0) break;
  }
  return round2(total);
}
function tierBreakdown(distance, tiers){
  distance = Math.max(0, Number(distance)||0);
  var remaining = distance, prevLimit = 0, out = [];
  for(var i=0;i<tiers.length;i++){
    var tier = tiers[i];
    var bandSize = tier.upTo === Infinity ? Infinity : (tier.upTo - prevLimit);
    var used = Math.min(remaining, bandSize);
    out.push({ upTo: tier.upTo, rate: tier.rate, distance: used, amount: round2(used*tier.rate) });
    remaining -= used;
    prevLimit = tier.upTo;
  }
  return out;
}
function tripDistance(t){
  var d = Number(t.distance)||0;
  return t.roundTrip ? d*2 : d;
}
function isBusinessTrip(t){ return t.kind === "business"; }
function businessTrips(trips){ return (trips||[]).filter(isBusinessTrip); }
function totalDistance(trips){
  return round2((trips||[]).reduce(function(sum,t){ return sum + tripDistance(t); }, 0));
}
function businessDistance(trips){ return totalDistance(businessTrips(trips)); }
function mileageDeductionTotal(trips, preset){
  return tieredAmount(businessDistance(trips), preset.tiers);
}
function mileageMonthlyBreakdown(trips, preset){
  var byMonth = {};
  businessTrips(trips).forEach(function(t){
    var mk = monthKey(t.date);
    if(!mk) return;
    byMonth[mk] = (byMonth[mk]||0) + tripDistance(t);
  });
  var keys = Object.keys(byMonth).sort();
  return keys.map(function(mk){
    var dist = round2(byMonth[mk]);
    return { month: mk, distance: dist, amount: tieredAmount(dist, preset.tiers) };
  });
}
function thresholdProgress(distance, tiers){
  var firstTier = tiers[0];
  if(firstTier.upTo === Infinity) return null;
  return { used: Math.min(distance, firstTier.upTo), limit: firstTier.upTo, pct: Math.min(100, Math.round((distance/firstTier.upTo)*100)) };
}

/* ---- reseller inventory / sales / profit engine ---- */
var PLATFORMS = [
  { code:"EBAY",      label:"eBay",              feePct:13.25 },
  { code:"POSHMARK",  label:"Poshmark",           feePct:20 },
  { code:"VINTED",    label:"Vinted",             feePct:0 },
  { code:"DEPOP",     label:"Depop",              feePct:10 },
  { code:"MERCARI",   label:"Mercari",            feePct:10 },
  { code:"ETSY",      label:"Etsy",               feePct:6.5 },
  { code:"FACEBOOK",  label:"Facebook Marketplace", feePct:5 },
  { code:"OTHER",     label:"Other / in person",  feePct:0 }
];
function platformLabel(code){
  var p = PLATFORMS.filter(function(x){return x.code===code;})[0];
  return p ? p.label : code;
}
function defaultFeePct(code, overrides){
  if(overrides && typeof overrides[code] === "number") return overrides[code];
  var p = PLATFORMS.filter(function(x){return x.code===code;})[0];
  return p ? p.feePct : 0;
}
function itemById(items, id){
  return (items||[]).filter(function(i){return i.id===id;})[0] || null;
}
function saleRevenue(sale){
  return round2((Number(sale.salePrice)||0) + (Number(sale.shippingCharged)||0));
}
function saleFeeAmount(sale){
  var pct = Number(sale.feePct)||0;
  return round2(saleRevenue(sale) * pct / 100);
}
function saleNetProfit(sale, item){
  var revenue = saleRevenue(sale);
  var fee = saleFeeAmount(sale);
  var cost = round2((item ? Number(item.costBasis)||0 : 0) + (Number(sale.shippingCost)||0));
  return round2(revenue - fee - cost);
}
function saleROIPct(sale, item){
  var cost = item ? Number(item.costBasis)||0 : 0;
  if(cost<=0) return null;
  return round2((saleNetProfit(sale,item)/cost)*100);
}
function daysToSell(item, sale){
  var listedISO = item && (item.dateListed || item.dateAcquired);
  return daysBetween(listedISO, sale && sale.saleDate);
}
function soldItemIds(sales){
  var m = {};
  (sales||[]).forEach(function(s){ m[s.itemId] = true; });
  return m;
}
function itemEffectiveStatus(item, sales){
  var sold = soldItemIds(sales);
  if(sold[item.id]) return "sold";
  return item.status || "unsold";
}
function unsoldItems(items, sales){
  var sold = soldItemIds(sales);
  return (items||[]).filter(function(i){ return !sold[i.id]; });
}
function inventoryCostValue(items, sales){
  return round2(unsoldItems(items, sales).reduce(function(sum,i){ return sum + (Number(i.costBasis)||0); }, 0));
}
function daysInStock(item, asOfISO){
  var startISO = item.dateListed || item.dateAcquired;
  var d = daysBetween(startISO, asOfISO || todayISO());
  return d === null ? null : Math.max(0, d);
}
function agingUnsold(items, sales, minDays, asOfISO){
  return unsoldItems(items, sales)
    .map(function(i){ return { item: i, days: daysInStock(i, asOfISO) }; })
    .filter(function(r){ return r.days !== null && r.days >= minDays; })
    .sort(function(a,b){ return b.days - a.days; });
}
function salesInRange(sales, fromISO, toISO_){
  return (sales||[]).filter(function(s){
    if(fromISO && s.saleDate < fromISO) return false;
    if(toISO_ && s.saleDate > toISO_) return false;
    return true;
  });
}
function salesForYear(sales, year){
  return (sales||[]).filter(function(s){ return yearOf(s.saleDate) === year; });
}
function totalRevenue(sales){
  return round2((sales||[]).reduce(function(sum,s){ return sum + saleRevenue(s); }, 0));
}
function totalFees(sales){
  return round2((sales||[]).reduce(function(sum,s){ return sum + saleFeeAmount(s); }, 0));
}
function totalShippingCost(sales){
  return round2((sales||[]).reduce(function(sum,s){ return sum + (Number(s.shippingCost)||0); }, 0));
}
function totalCOGS(sales, items){
  return round2((sales||[]).reduce(function(sum,s){
    var it = itemById(items, s.itemId);
    return sum + (it ? Number(it.costBasis)||0 : 0);
  }, 0));
}
function totalNetProfit(sales, items){
  return round2((sales||[]).reduce(function(sum,s){
    return sum + saleNetProfit(s, itemById(items, s.itemId));
  }, 0));
}
function totalExpenses(expenses){
  return round2((expenses||[]).reduce(function(sum,e){ return sum + (Number(e.amount)||0); }, 0));
}
function avgROI(sales, items){
  var vals = (sales||[]).map(function(s){ return saleROIPct(s, itemById(items,s.itemId)); }).filter(function(v){ return v !== null; });
  if(!vals.length) return null;
  return round2(vals.reduce(function(a,b){ return a+b; }, 0) / vals.length);
}
function platformBreakdown(sales, items){
  var byCode = {};
  (sales||[]).forEach(function(s){
    var code = s.platform || "OTHER";
    if(!byCode[code]) byCode[code] = { platform: code, count:0, revenue:0, fees:0, netProfit:0 };
    var row = byCode[code];
    row.count += 1;
    row.revenue = round2(row.revenue + saleRevenue(s));
    row.fees = round2(row.fees + saleFeeAmount(s));
    row.netProfit = round2(row.netProfit + saleNetProfit(s, itemById(items, s.itemId)));
  });
  return Object.keys(byCode).map(function(k){ return byCode[k]; }).sort(function(a,b){ return b.netProfit - a.netProfit; });
}
function monthlyProfitBreakdown(sales, items){
  var byMonth = {};
  (sales||[]).forEach(function(s){
    var mk = monthKey(s.saleDate);
    if(!mk) return;
    byMonth[mk] = round2((byMonth[mk]||0) + saleNetProfit(s, itemById(items, s.itemId)));
  });
  return Object.keys(byMonth).sort().map(function(mk){ return { month: mk, netProfit: byMonth[mk] }; });
}
function toCSV(sales, items){
  var rows = [["Sale date","Item","SKU","Platform","Sale price","Shipping charged","Shipping cost","Fee %","Fee amount","Cost basis","Net profit","ROI %","Days to sell"]];
  (sales||[]).slice().sort(function(a,b){ return a.saleDate < b.saleDate ? -1 : 1; }).forEach(function(s){
    var it = itemById(items, s.itemId);
    var roi = saleROIPct(s, it);
    rows.push([
      s.saleDate, it?it.name:"", it?it.sku:"", platformLabel(s.platform),
      (Number(s.salePrice)||0).toFixed(2), (Number(s.shippingCharged)||0).toFixed(2),
      (Number(s.shippingCost)||0).toFixed(2), (Number(s.feePct)||0).toFixed(2),
      saleFeeAmount(s).toFixed(2), it?(Number(it.costBasis)||0).toFixed(2):"0.00",
      saleNetProfit(s,it).toFixed(2), roi===null?"":roi.toFixed(2),
      (function(){ var d=daysToSell(it,s); return d===null?"":d; })()
    ]);
  });
  return rows.map(function(r){
    return r.map(function(c){
      var str = String(c);
      return /[",\n]/.test(str) ? '"'+str.replace(/"/g,'""')+'"' : str;
    }).join(",");
  }).join("\n");
}

if(typeof module !== "undefined" && module.exports){
  module.exports = {
    pad2, toISO, parseISO, todayISO, addDays, monthKey, yearOf, uid, round2, formatMoney, daysBetween,
    RATE_PRESETS, tieredAmount, tierBreakdown, tripDistance, isBusinessTrip, businessTrips,
    totalDistance, businessDistance, mileageDeductionTotal, mileageMonthlyBreakdown, thresholdProgress,
    PLATFORMS, platformLabel, defaultFeePct, itemById, saleRevenue, saleFeeAmount, saleNetProfit,
    saleROIPct, daysToSell, soldItemIds, itemEffectiveStatus, unsoldItems, inventoryCostValue,
    daysInStock, agingUnsold, salesInRange, salesForYear, totalRevenue, totalFees, totalShippingCost,
    totalCOGS, totalNetProfit, totalExpenses, avgROI, platformBreakdown, monthlyProfitBreakdown, toCSV
  };
}
</script>

<script id="uiapp">

function seedSample(){

    { id: uid(), sku:"SKU-1005", name:"North Face Fleece",        category:"Clothing", costBasis:9.50,  platform:"DEPOP",    status:"unsold", dateAcquired: iso(-10), dateListed: "",        listPrice:29.00, notes:"Needs photos" },
    { id: uid(), sku:"SKU-1006", name:"Kate Spade Wallet",        category:"Bags",     costBasis:6.00,  platform:"EBAY",     status:"listed", dateAcquired: iso(-70), dateListed: iso(-68), listPrice:22.00, notes:"" }
  ];
  var sales = [
    { id: uid(), itemId: items[1].id, platform:"POSHMARK", saleDate: iso(-3),  salePrice:65.00, shippingCharged:6.49, shippingCost:5.20, feePct:20,   notes:"" },
    { id: uid(), itemId: items[2].id, platform:"VINTED",   saleDate: iso(-8),  salePrice:48.00, shippingCharged:0,    shippingCost:4.10, feePct:0,    notes:"Vinted buyer pays fee" }
  ];
  var expenses = [
    { id: uid(), date: iso(-30), category:"Supplies", amount:14.99, notes:"Poly mailers x100" },
    { id: uid(), date: iso(-15), category:"Sourcing", amount:22.00, notes:"Thrift store trip" },
    { id: uid(), date: iso(-2),  category:"Software", amount:9.99,  notes:"Listing tool subscription" }
  ];
  var vehicles = [
    { id: uid(), label:"Personal car (sourcing runs)", plate:"", notes:"" }
  ];

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  });
  (kids||[]).forEach(function(k){ if(k) e.appendChild(typeof k === "string" ? document.createTextNode(k) : k); });
  return e;
}

/* ---------------------------------------------------------------- REPORTS */
function viewReports(){
  var years = uniqueYears();
  var sales = salesForYear(STATE.sales, REPORT_YEAR);
  var rev = totalRevenue(sales);
  var cogs = totalCOGS(sales, STATE.items);
  var fees = totalFees(sales);
  var ship = totalShippingCost(sales);
  var grossProfit = totalNetProfit(sales, STATE.items);
  var expenses = totalExpenses(STATE.expenses.filter(function(e){ return yearOf(e.date)===REPORT_YEAR; }));
  var netProfit = round2(grossProfit - expenses);
  var mileageDed = mileageDeductionTotal(businessTrips(STATE.trips.filter(function(t){ return yearOf(t.date)===REPORT_YEAR; })), currentPreset());
  var monthly = monthlyProfitBreakdown(sales, STATE.items);
  var maxAbs = Math.max(1, monthly.reduce(function(m,r){ return Math.max(m, Math.abs(r.netProfit)); }, 1));

  return el("div", {}, [
    el("div", { class:"row" }, [
      el("div", {}, [el("h2",{},["Profit & loss"]), el("p",{class:"hint"},["Pick a year, see exactly how the total was reached."])]),
      el("select", { onchange:function(e){ REPORT_YEAR = e.target.value; render(); } }, years.map(function(y){
        return el("option", { value:y, selected: y===REPORT_YEAR ? "selected" : undefined }, [y]);
      }))
    ]),
    el("div", { class:"card" }, [
      pnlRow("Revenue (sale price + shipping charged)", rev),
      pnlRow("Cost of goods sold", -cogs),
      pnlRow("Platform fees", -fees),
      pnlRow("Shipping cost", -ship),
      pnlRow("Gross profit", grossProfit, true),
      pnlRow("Business expenses", -expenses),
      pnlRow("Net profit", netProfit, true)
    ]),
    el("div", { class:"note-box" }, [
      "Estimated mileage tax deduction for " + REPORT_YEAR + ": " + money(mileageDed) +
      ". This reduces taxable income — it is not included in net profit above, since it isn't cash you received."
    ]),
    el("div", { class:"card" }, [
      el("h2", {}, ["Net profit by month"]),
      monthly.length ? monthly.map(function(r){
        var pct = Math.max(4, Math.round((Math.abs(r.netProfit)/maxAbs)*100));
        return el("div", { class:"barrow" }, [
          el("div",{class:"lbl"},[r.month]),
          el("div",{class:"track"},[el("div",{class:"fill", style:"width:"+pct+"%"},[])]),
          el("div",{class:"amt"},[money(r.netProfit)])
        ]);
      }) : el("div", { class:"empty" }, ["No sales this year yet."])
    ])
  ]);
}
function pnlRow(label, amount, isTotal){
  var cls = "pnlrow" + (isTotal?" total":"");

  return el("div", { class:cls }, [el("span",{},[label]), valEl]);

function uniqueYears(){
  var ys = {};
  STATE.sales.forEach(function(s){ if(s.saleDate) ys[yearOf(s.saleDate)] = true; });

  ys[yearOf(todayISO())] = true;
  return Object.keys(ys).sort();
}

  var reader = new FileReader();
  reader.onload = function(){
    try{
